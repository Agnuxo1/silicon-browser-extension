<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SiliconSignature</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { width:360px; font-family:'Inter',system-ui,sans-serif; background:#0a0a0a; color:#e0e0e0; padding:16px; }
.header { display:flex; align-items:center; gap:10px; margin-bottom:14px; }
.header h1 { font-size:16px; font-weight:700; color:#f0f0f0; }
.header .chip { font-size:10px; background:#1a1a2e; color:#60a5fa; padding:2px 8px; border-radius:4px; border:1px solid #2563eb; }
.dropzone { border:2px dashed #333; border-radius:10px; padding:20px; text-align:center; cursor:pointer; transition:0.2s; }
.dropzone:hover { border-color:#2563eb; background:#0d1117; }
.dropzone input { display:none; }
#status { margin-top:12px; padding:10px; border-radius:8px; font-size:12px; min-height:40px; }
.status-ok { background:#064e3b; color:#6ee7b7; border:1px solid #059669; }
.status-fail { background:#450a0a; color:#fca5a5; border:1px solid #dc2626; }
.status-warn { background:#422006; color:#fcd34d; border:1px solid #d97706; }
.btn { width:100%; padding:10px; border-radius:8px; border:none; cursor:pointer; font-size:13px; font-weight:600; margin-top:8px; }
.btn-verify { background:#2563eb; color:#fff; }
.btn-verify:hover { background:#1d4ed8; }
.btn-scan { background:#1a1a2e; color:#e0e0e0; border:1px solid #333; }
.footer { margin-top:12px; font-size:10px; color:#666; text-align:center; }
</style>
</head>
<body>
<div class="header">
  <div style="width:28px;height:28px;background:#2563eb;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:14px;">🔐</div>
  <h1>SiliconSignature</h1>
  <span class="chip">ASIC-Bound</span>
</div>

<div class="dropzone" id="dropzone">
  <p style="font-size:13px;color:#999;">Drop image here or click to verify</p>
  <input type="file" id="fileInput" accept="image/*">
</div>

<button class="btn btn-scan" id="btnScan">🔍 Scan Images on This Page</button>
<button class="btn btn-verify" id="btnVerify">Verify SiliconSignature</button>

<div id="status">Ready. Upload an image to verify its ASIC signature.</div>

<div class="footer">
  Reed-Solomon LSB • SHA-256 ASIC • Offline verify<br>
  <a href="https://siliconsignature.pages.dev" style="color:#666;">siliconsignature.pages.dev</a>
</div>

<script src="popup.js"></script>
</body>
</html>
